# Build, test and fuzz qtc on Qt 6.12 LTS, the supported release. Qt comes from conda-forge,
# the packages qtc was developed and tested against (QT_PACKAGES), installed with micromamba.
name: ci
on: [push, pull_request]

env:
  QT_PACKAGES: >-
    qt6-main=6.12.0 qt6-charts=6.12.0 qt6-multimedia=6.12.0 qt6-serialport=6.12.0
    qt6-positioning=6.12.0 qt6-networkauth=6.12.0

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: release, build_type: Release, sanitize: '' }
          - { name: sanitizers, build_type: RelWithDebInfo, sanitize: 'address,undefined' }
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qt
          create-args: ${{ env.QT_PACKAGES }}
          condarc: |
            channels: [conda-forge]
          cache-environment: true
      - name: Build tools
        run: |
          sudo apt-get update
          # Xvfb, Mesa's llvmpipe and lavapipe: the graphics tests render on OpenGL and Vulkan
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libxkbcommon-dev xvfb mesa-vulkan-drivers libvulkan-dev vulkan-validationlayers
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DQTC_SANITIZE=${{ matrix.sanitize }} -DCMAKE_PREFIX_PATH=$MAMBA_ROOT_PREFIX/envs/qt
      - run: cmake --build build
      - run: ctest --test-dir build -LE slow --output-on-failure
      - name: Method fuzzer (fixed order, by name, lifetime, two random orders)
        # docs/LIMITS.md lists the failures still open; a run that hits one of them fails
        run: |
          set +e; rc=0
          python3 tests/fuzz_driver.py --binary build/tests/fuzz_methods --work fw0 --report r0.json || rc=1
          python3 tests/fuzz_driver.py --binary build/tests/fuzz_methods --work fwn --report rn.json --by-name || rc=1
          python3 tests/fuzz_driver.py --binary build/tests/fuzz_methods --work fwl --report rl.json --lifetime || rc=1
          python3 tests/fuzz_driver.py --binary build/tests/fuzz_methods --work fw1 --report r1.json --seed 1 || rc=1
          python3 tests/fuzz_driver.py --binary build/tests/fuzz_methods --work fw2 --report r2.json --seed 2 || rc=1
          exit $rc
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-reports-${{ matrix.name }}
          path: '*.json'

  other-platforms:
    # builds only; qtc has not been tested on these systems yet
    continue-on-error: true
    strategy:
      matrix:
        # macos-latest: GitHub retires its macOS images, as it did macos-14
        os: [macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: qt
          create-args: ${{ env.QT_PACKAGES }}
          condarc: |
            channels: [conda-forge]
          cache-environment: true
      - name: Qt's prefix
        # conda-forge puts Qt under Library on Windows, with its DLLs in Library\bin, which
        # Qt's tools (moc, rcc) need on PATH to start: the environment is not activated
        run: |
          prefix="$MAMBA_ROOT_PREFIX/envs/qt"
          if [ "$RUNNER_OS" = Windows ]; then
            prefix="$prefix/Library"
            cygpath -w "$prefix/bin" >> "$GITHUB_PATH"
          fi
          echo "QT_PREFIX=$prefix" >> "$GITHUB_ENV"
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQTC_BUILD_TESTS=OFF -DCMAKE_PREFIX_PATH="$QT_PREFIX"
      - run: cmake --build build --config Release
